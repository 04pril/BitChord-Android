name: 4pril Android test APK

on:
  push:
    branches: [feat/app-local-proxy]
    tags: ['4pril-android-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides ANDROID_HOME; use BitChord's upstream
      # setup pattern. setup-android@v3 currently fails on sdkmanager 'tools'.
      - uses: gradle/actions/setup-gradle@v4
      # Native source is public and pinned. This compiles the userspace tunnel
      # into the SAME APK; no Morphe patcher, prebuilt VPN app or VpnService.
      - name: Checkout pinned WireGuard userspace source
        uses: actions/checkout@v4
        with:
          repository: seo-rii/morphe-patches
          ref: d03b7439f517eeed13d12edc1f922ee0e640cd13
          path: wireguard-source
          sparse-checkout: |
            native/wireguard
            scripts/build-wireguard-android.sh
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install native Android NDK r28c
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
      - name: Build embedded WireGuard (arm64-v8a and x86_64)
        run: |
          test "$(git -C wireguard-source rev-parse HEAD)" = d03b7439f517eeed13d12edc1f922ee0e640cd13
          # Hosted runners may set ANDROID_NDK_HOME to an older NDK.
          # The native script prioritizes that variable over ANDROID_HOME,
          # so force the installed r28c path instead of accepting a mismatch.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          test -f "$ANDROID_NDK_HOME/source.properties"
          sed -n '/Pkg.Revision/p' "$ANDROID_NDK_HOME/source.properties"
          bash wireguard-source/scripts/build-wireguard-android.sh arm64-v8a x86_64
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "wireguard-source/native/wireguard/build/android/$abi/libmorphewireguard.so" "app/src/main/jniLibs/$abi/"
            test -s "app/src/main/jniLibs/$abi/libmorphewireguard.so"
          done
          mkdir -p app/src/main/assets/wireguard/licenses
          cp wireguard-source/LICENSE wireguard-source/NOTICE app/src/main/assets/wireguard/licenses/
          cp -a wireguard-source/native/wireguard/licenses/. app/src/main/assets/wireguard/licenses/
      - name: Assemble standalone installable dev APK
        run: bash ./gradlew --no-daemon :app:assembleDevDebug
      - name: Run unit tests (report locale completeness failures separately)
        continue-on-error: true
        run: bash ./gradlew --no-daemon :app:testDevDebugUnitTest
      - name: Collect clearly labeled test APKs
        run: |
          mkdir -p distribution
          for apk in app/build/outputs/apk/dev/debug/*.apk; do
            test -f "$apk" || continue
            case "$(basename "$apk")" in *armeabi-v7a*) continue ;; esac
            if ! unzip -Z1 "$apk" | grep -Eq 'lib/(arm64-v8a|x86_64)/libmorphewireguard[.]so'; then
              echo "WireGuard native library missing from $apk" >&2
              exit 1
            fi
            cp "$apk" "distribution/BitChord-4pril-WG-TEST-${GITHUB_RUN_NUMBER}-$(basename "$apk")"
          done
          ls distribution/*.apk
          sha256sum distribution/*.apk > distribution/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-4pril-Android-TEST-APK
          path: distribution/*
          if-no-files-found: error
          retention-days: 30
      # Each successful feature-branch build creates a clearly labeled pre-release
      # with installable APK assets, so testers need no Morphe patcher or Actions ZIP.
      - name: Publish installable Android test APK to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/app-local-proxy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="4pril-android-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" distribution/* --target "$GITHUB_SHA" \
            --title "4pril BitChord Android TEST #${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Development APK with userspace WireGuard native engine inside the APK (arm64-v8a / x86_64). User imports WireGuard .conf in settings. Existing audio engine unchanged. Google login WebView proxy authentication requires real-device verification. Not a system-wide VPN, no Morphe patcher."
      - name: Publish prerelease on tag
        if: startsWith(github.ref, 'refs/tags/4pril-android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" distribution/* --title "4pril Android TEST $GITHUB_REF_NAME" --prerelease --notes "Direct-install development APK including native userspace WireGuard. Google sign-in WebView requires real-device verification."
