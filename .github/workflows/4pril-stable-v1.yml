name: Publish 4pril Android stable v1.0.0

on:
  push:
    branches: [feat/app-local-proxy]
    paths:
      - '.github/workflows/4pril-stable-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 4pril-android-v1.0.0-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify R8 APKs and publish stable GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source release and copy exact built APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          source_tag="4pril-android-test-32"
          expected_sha="b1f5cb2f780a02a94131ae94e7a09c72e6d39fea"
          actual_sha="$(gh api "repos/$repo/releases/tags/$source_tag" --jq '.target_commitish')"
          test "$actual_sha" = "$expected_sha" || {
            echo "Source release commit mismatch: $actual_sha" >&2
            exit 1
          }
          mkdir -p distribution stable
          gh release download "$source_tag" --repo "$repo" --dir distribution
          sha256sum -c distribution/SHA256SUMS.txt
          # Published GitHub assets also expose independent SHA-256 digests.
          echo "a6f6b2a0b22e0742a0ff02a3759a1284be1d8cfb7348fe1aa99c302ede368263  distribution/BitChord-4pril-WG-R8-OPT-32-app-dev-arm64-v8a-optimized.apk" | sha256sum -c -
          echo "f055532d8a1ea4b83cf2a16a313ad121996c35e267955cf4cec808bdedf1fd02  distribution/BitChord-4pril-WG-R8-OPT-32-app-dev-universal-optimized.apk" | sha256sum -c -
          echo "28f84930e5065fa86324d8ee21002e0b735fc26ea895d23d771a4604caa1fbe2  distribution/BitChord-4pril-WG-R8-OPT-32-app-dev-x86_64-optimized.apk" | sha256sum -c -
          cp distribution/BitChord-4pril-WG-R8-OPT-32-app-dev-arm64-v8a-optimized.apk stable/BitChord-4pril-v1.0.0-arm64-v8a.apk
          cp distribution/BitChord-4pril-WG-R8-OPT-32-app-dev-universal-optimized.apk stable/BitChord-4pril-v1.0.0-universal.apk
          cp distribution/BitChord-4pril-WG-R8-OPT-32-app-dev-x86_64-optimized.apk stable/BitChord-4pril-v1.0.0-x86_64.apk
          unzip -Z1 stable/BitChord-4pril-v1.0.0-arm64-v8a.apk | grep -q '^lib/arm64-v8a/libmorphewireguard[.]so$'
          unzip -Z1 stable/BitChord-4pril-v1.0.0-universal.apk | grep -q '^lib/arm64-v8a/libmorphewireguard[.]so$'
          unzip -Z1 stable/BitChord-4pril-v1.0.0-x86_64.apk | grep -q '^lib/x86_64/libmorphewireguard[.]so$'
          (cd stable && sha256sum *.apk > SHA256SUMS.txt)
          echo "Verified source SHA, source digests, embedded WireGuard, and stable checksum manifest."

      - name: Publish non-prerelease latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="4pril-android-v1.0.0"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; not replacing it." >&2
            exit 1
          fi
          gh release create "$release_tag" stable/*.apk stable/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "b1f5cb2f780a02a94131ae94e7a09c72e6d39fea" \
            --title "4pril BitChord Android v1.0.0" \
            --notes-file .github/release-notes/4pril-android-v1.0.0.md \
            --latest
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json url,prerelease,isLatest,tagName
